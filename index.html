<style>
:root{--navy:#17365d;--teal:#168477;--gold:#f5b914;--bg:#f2f5f9;--card:#fff;--line:#e2e8f0;--ink:#1d2939;--mut:#667085;--inc:#12805c;--exp:#c2410c;--red:#b42318;--soft:#eef3f8;--shadow:0 2px 10px #17365d14}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1621;--card:#16212f;--line:#263447;--ink:#e6edf5;--mut:#9fb0c3;--inc:#34d399;--exp:#fb923c;--red:#f87171;--soft:#1d2b3c;--shadow:none}}
:root[data-theme=dark]{--bg:#0e1621;--card:#16212f;--line:#263447;--ink:#e6edf5;--mut:#9fb0c3;--inc:#34d399;--exp:#fb923c;--red:#f87171;--soft:#1d2b3c;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri","Noto Sans Bengali","Kalpurush","Nirmala UI","Vrinda","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(120deg,#17365d,#168477);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top img{width:40px;height:40px;border-radius:50%;background:#fff;flex:none}
header.top h1{font-size:18px;margin:0;line-height:1.2}
header.top small{opacity:.85;display:block;font-size:12px}
header.top .sp{flex:1}
header.top button{background:#ffffff26;border:1px solid #ffffff55;color:#fff;border-radius:18px;padding:5px 12px;font-weight:700;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}.wrap{flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.neg{color:var(--red)}
.hero{background:linear-gradient(135deg,#17365d,#1f6f8b 60%,#168477);color:#fff;border:0}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.hero .mut{color:#ffffffbb}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#ffffff1f;border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:17px}
.mnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.mnav button{background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.mnav b{min-width:150px;text-align:center}
button.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
button.btn.g{background:var(--teal)}button.btn.r{background:var(--red)}
button.btn.s{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
button.btn.sm{padding:6px 12px;font-size:13px}
button.btn:disabled{opacity:.5}
input[type=text],input[type=date],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.list>.it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list>.it:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.it .m{flex:1;min-width:0}
.it .m b,.it .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .a{font-weight:800;text-align:right;white-space:nowrap}
.dh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mut);padding:10px 4px 2px}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar i.w{background:var(--gold)}.bar i.x{background:var(--red)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.tabs3 button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-weight:700;cursor:pointer}
.tabs3 button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}
.tabs3 button.on.i{background:var(--inc);color:#fff;border-color:var(--inc)}
.tabs3 button.on.t{background:var(--navy);color:#fff;border-color:var(--navy)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;display:block;line-height:1.25;font-size:12.5px}
.cats button .e{font-size:22px;display:block}
.cats button.on{border-color:var(--teal);background:#16847722;outline:2px solid var(--teal)}
.amt{font-size:30px;font-weight:800;text-align:center;border:0!important;background:var(--soft)!important}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 6px;cursor:pointer;color:var(--mut);font-size:11px;font-weight:700}
nav.bot button span{display:block;font-size:20px;line-height:1.2}
nav.bot button.on{color:var(--teal)}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:#17365d;font-size:32px;font-weight:700;box-shadow:0 6px 16px #0004;cursor:pointer;z-index:7}
#sheetBg{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheetBg.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet .hd{display:flex;align-items:center;margin-bottom:6px}
#sheet .hd h2{margin:0;font-size:17px;flex:1}
#sheet .hd button{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.foot{display:flex;gap:10px;margin-top:16px}
.foot .btn{flex:1}
#lock{position:fixed;inset:0;background:linear-gradient(160deg,#17365d,#168477);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;padding:20px}
#lock.on{display:flex}
#lock img{width:84px;height:84px;border-radius:50%;background:#fff}
.dots{display:flex;gap:14px;height:18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:24px;font-weight:700;cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#101828;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;background:#fff8e6;border:1px solid #f3d89b;color:#6b4a00}
.banner.r{background:#fff1f0;border-color:#f0b4af;color:#8c1d14}
.legend{display:grid;gap:6px;margin-top:10px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.tag{font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--soft)}
.tag.r{background:#fde2e0;color:var(--red)}.tag.g{background:#dcf5ea;color:var(--inc)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet{animation:up .22s ease-out}
.wcards{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 12px;scroll-snap-type:x proximity}
.wc{flex:none;min-width:150px;border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;scroll-snap-align:start;box-shadow:0 4px 12px #0002}
.wc small{opacity:.9;display:block}.wc b{font-size:18px}.wc .i{font-size:22px;display:block}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px;cursor:pointer;font-size:11.5px;line-height:1.25;box-shadow:var(--shadow)}
.qa button span{display:block;font-size:24px}
.week{display:flex;align-items:flex-end;gap:8px;height:96px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week i{display:block;background:var(--teal);border-radius:5px 5px 2px 2px;min-height:3px;opacity:.55;margin-bottom:3px}
.week div.t i{opacity:1;background:var(--gold)}
.amtbox{background:var(--soft);border-radius:14px;padding:8px 14px;text-align:right;margin-bottom:8px}
.amtbox .v{font-size:34px;font-weight:800;line-height:1.25;word-break:break-all}
.amtbox .eq{font-size:13px;color:var(--mut);min-height:20px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:21px;font-weight:700;cursor:pointer}
.keypad button.op{background:var(--soft);color:var(--teal)}
.keypad button:active{background:var(--soft)}
.eye{background:#ffffff26;border:0;border-radius:50%;width:34px;height:34px;color:#fff;cursor:pointer;font-size:16px;float:right}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#toast button{margin-left:10px;background:#ffffff26;border:0;color:#ffd24d;font-weight:700;border-radius:8px;padding:4px 10px;cursor:pointer}
#toast.act{pointer-events:auto}
.ins>div{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.ins>div:last-child{border:0}
.ins .e{font-size:22px}
.safe{background:linear-gradient(135deg,#e8f7f1,#fff8e6);border:1px solid #bfe3d4;color:#17365d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .safe{background:#1b3a34;border-color:#2c5a50;color:#e6edf5}}
:root[data-theme=dark] .safe{background:#1b3a34;border-color:#2c5a50;color:#e6edf5}
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block;padding:0;color:#000;background:#fff;font-size:12px}
  #printRoot h1{font-size:20px;margin:0 0 4px}#printRoot h2{font-size:14px;margin:14px 0 4px;border-bottom:2px solid #17365d;color:#17365d}
  #printRoot table{width:100%;border-collapse:collapse}#printRoot th,#printRoot td{border:1px solid #bbb;padding:3px 6px;text-align:left}
  #printRoot th{background:#e8eef5}#printRoot td.n{text-align:right}
  body{padding:0;background:#fff}
}
</style>

class Sheet{
  constructor(name){this.name=name;this.rows=[];this.widths=[];this.merges=[];this.freeze=null;this.filter=null;this.tab=null;this.heights={};this.grid=true;this.sel=false;this.titles=null}
  set(r,c,v,s){(this.rows[r]=this.rows[r]||[])[c]={v,s}}
  xml(){
    let maxC=0;this.rows.forEach(r=>{if(r&&r.length>maxC)maxC=r.length});
    let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
    x+=`<sheetPr>${this.tab?`<tabColor rgb="FF${this.tab}"/>`:''}<pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${colName(Math.max(maxC,1))}${Math.max(this.rows.length,1)}"/>`;
    x+=`<sheetViews><sheetView workbookViewId="0"${this.grid?'':' showGridLines="0"'}${this.sel?' tabSelected="1"':''}>`;
    if(this.freeze){const [fc,fr]=this.freeze,pane=fc&&fr?'bottomRight':fr?'bottomLeft':'topRight';x+=`<pane${fc?` xSplit="${fc}"`:''}${fr?` ySplit="${fr}"`:''} topLeftCell="${colName(fc+1)}${fr+1}" activePane="${pane}" state="frozen"/><selection pane="${pane}"/>`}
    x+='</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>';
    if(this.widths.length)x+='<cols>'+this.widths.map((w,i)=>w?`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`:'').join('')+'</cols>';
    x+='<sheetData>';
    this.rows.forEach((row,ri)=>{
      if(!row&&!this.heights[ri])return;
      x+=`<row r="${ri+1}"${this.heights[ri]?` ht="${this.heights[ri]}" customHeight="1"`:''}>`;
      (row||[]).forEach((c,ci)=>{
        if(!c)return;const ref=colName(ci+1)+(ri+1),s=c.s?` s="${c.s}"`:'';
        if(typeof c.v==='number'&&isFinite(c.v))x+=`<c r="${ref}"${s}><v>${c.v}</v></c>`;
        else if(c.v===''||c.v==null)x+=c.s?`<c r="${ref}"${s}/>`:'';
        else x+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
      });
      x+='</row>';
    });
    x+='</sheetData>';
    if(this.filter)x+=`<autoFilter ref="${this.filter}"/>`;
    if(this.merges.length)x+=`<mergeCells count="${this.merges.length}">${this.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`;
    x+='<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>';
    return x;
  }
}

/* ================= SHA-256 (for PIN) ================= */
const SHA=(()=>{const pr=[];for(let n=2;pr.length<64;n++)if(pr.every(p=>n%p))pr.push(n);
 const K=pr.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296)),H0=pr.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296));
 return str=>{const b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const h=H0.slice(),w=new Uint32Array(64),rr=(x,c)=>(x>>>c)|(x<<(32-c));
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
   for(let i=16;i<64;i++){const a=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),c=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+a+w[i-7]+c)>>>0}
   let[a,b2,c,d,e,f,g,hh]=h;
   for(let i=0;i<64;i++){const s1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+s1+ch+K[i]+w[i])>>>0,s0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(s0+mj)>>>0;
    hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
   h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b2)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0}
  return h.map(x=>x.toString(16).padStart(8,'0')).join('')}})();

function syncTf(){const g=i=>{const e=$('#'+i);return e?e.value:null},tf=U.tf,d=g('f_d'),w=g('f_w'),w2=g('f_w2'),n=g('f_note');if(d!==null&&d!=='')tf.d=d;if(w)tf.w=w;if(w2)tf.w2=w2;if(n!==null)tf.note=n}
const KEYS=[['7','8','9','⌫'],['4','5','6','+'],['1','2','3','-'],['.','0','00','*']];
const showExpr=e=>digits(e.replace(/\*/g,'×').replace(/-/g,'−').replace(/\//g,'÷'));
function evalExpr(s){
  s=String(s||'').trim();if(!s||!/^[\d.+\-*/]+$/.test(s))return NaN;
  const tk=s.match(/\d*\.?\d+|\d+\.|[+\-*/]/g);if(!tk||tk.join('')!==s)return NaN;
  let i=0;
  const num=()=>{let sg=1;while(tk[i]==='-'||tk[i]==='+'){if(tk[i]==='-')sg=-sg;i++}const v=parseFloat(tk[i++]);return isNaN(v)?NaN:sg*v};
  const term=()=>{let v=num();while(tk[i]==='*'||tk[i]==='/'){const o=tk[i++],r=num();v=o==='*'?v*r:v/r}return v};
  let v=term();while(i<tk.length&&(tk[i]==='+'||tk[i]==='-')){const o=tk[i++],r=term();v=o==='+'?v+r:v-r}
  return i===tk.length&&isFinite(v)?Math.round(v*100)/100:NaN;
}
function amtUpdate(){
  const v=$('#amtV');if(!v)return;const e=U.tf.expr;
  v.textContent=S.settings.cur+(e?showExpr(e):digits('0'));
  const r=evalExpr(e);$('#amtEq').textContent=/[+\-*/]/.test(e.replace(/^-/,''))&&isFinite(r)?'= '+money(r):'';
}
function pressKey(k){
  const tf=U.tf;let e=tf.expr;const last=e.split(/[+\-*/]/).pop();
  if(k==='⌫')e=e.slice(0,-1);
  else if('+-*/'.includes(k)){if(!e)return;if('+-*/'.includes(e.slice(-1)))e=e.slice(0,-1);e+=k}
  else if(k==='.'){if(last.includes('.'))return;e+=last===''?'0.':'.'}
  else{const dec=last.split('.')[1];if(dec!==undefined&&dec.length>=2)return;if(k==='00'&&(last===''||last==='0'))return;if(e.length>24)return;if(last==='0'&&k!=='00')e=e.slice(0,-1);e+=k}
  tf.expr=e;amtUpdate();
}

function donut(list,total){

  const segs=list.map((x,i)=>{const len=x.v/total*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return`<svg viewBox="0 0 140 140" width="170" height="170" role="img" aria-label="chart">${segs}<text x="70" y="66" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${t('expense')}</text><text x="70" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${money(total)}</text></svg>`;

function trendSvg(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(shiftM(U.month,-i));
  const data=ms.map(m=>({m,...sums(monthTx(m))})),mx=Math.max(1,...data.flatMap(d=>[d.i,d.e])),W=320,H=150,bw=16;
  let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="trend">`;
  data.forEach((d,i)=>{const x=i*(W/6)+(W/6-2*bw-4)/2,hi=d.i/mx*H,he=d.e/mx*H;
    s+=`<rect x="${x}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="#168477"/><rect x="${x+bw+4}" y="${H-he}" width="${bw}" height="${he}" rx="3" fill="#e4572e"/><text x="${x+bw+2}" y="${H+15}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".75">${MON[li()][+d.m.slice(5)-1]}</text>`});
  return s+'</svg>';
}

let pinBuf='',pinMode='unlock',pinFirst='',tries=0,lockUntil=0,hiddenAt=0;
function showLock(){
  if(!S.settings.pin)return;
  pinBuf='';pinMode='unlock';drawLock(t('enterPin'));$('#lock').classList.add('on');
}
function drawLock(msg){
  $('#lock').innerHTML=`<img src="${$('header.top img').src}" alt=""><h2 style="margin:0">${t('app')}</h2><div>${esc(msg)}</div><div class="dots">${[0,1,2,3,4,5].map(i=>`<i class="${i<pinBuf.length?'f':''}"></i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>
   <button type="button" id="forgot" style="background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;margin-top:6px">${t('forgot')}</button>`;
}
function lockKey(k){
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);return drawLock(t('enterPin'))}
  if(k==='✓'){return tryPin()}
  if(pinBuf.length<6)pinBuf+=k;
  drawLock(t('enterPin'));
}
function tryPin(){
  const now=Date.now();
  if(now<lockUntil)return drawLock(t('wait')+' '+Math.ceil((lockUntil-now)/1000)+'s');
  if(pinBuf.length>=4&&SHA(S.settings.salt+pinBuf)===S.settings.pin){tries=0;pinBuf='';$('#lock').classList.remove('on');$('#lock').innerHTML='';afterUnlock();return}
  tries++;pinBuf='';if(tries>=5){lockUntil=now+30000;tries=0}
  drawLock(t('pinWrong'));
}

  openSheet(S.settings.pin?t('changePin'):t('setPin'),`${S.settings.pin?`<label class="f">${t('pinCur')}</label><input type="password" id="p_cur" inputmode="numeric" maxlength="6" autocomplete="off">`:''}
   <label class="f">${t('pin')}</label><input type="password" id="p_new" inputmode="numeric" maxlength="6" autocomplete="off">
   <label class="f">${t('pinAgain')}</label><input type="password" id="p_new2" inputmode="numeric" maxlength="6" autocomplete="off">
   <div class="foot"><button class="btn g" type="button" data-a="savepin">${t('save')}</button></div>`);
}
const normPin=s=>String(s).replace(/[০-৯]/g,d=>BN.indexOf(d));
function savePin(){
  if(S.settings.pin&&SHA(S.settings.salt+normPin($('#p_cur').value))!==S.settings.pin)return toast(t('pinWrong'));
  const a=normPin($('#p_new').value),b=normPin($('#p_new2').value);
  if(!/^\d{4,6}$/.test(a))return toast(t('pinBad'));if(a!==b)return toast(t('pinMismatch'));
  S.settings.salt=uid()+uid();S.settings.pin=SHA(S.settings.salt+a);save();closeSheet();render();toast(t('saved2'));

function backupBlob(){return new Blob([JSON.stringify(S)],{type:'application/json'})}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
const stamp=()=>todayISO();
function dlBackup(){saveBlob(backupBlob(),'Income_Expense_Backup_'+stamp()+'.json');S.settings.lastBackup=Date.now();save();render();toast(t('saved2'))}
async function shareBackup(){
  const f=new File([backupBlob()],'Income_Expense_Backup_'+stamp()+'.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t('app')});S.settings.lastBackup=Date.now();save();render()}else dlBackup()}catch(e){if(e&&e.name!=='AbortError')dlBackup()}

function restore(file){
  const r=new FileReader();r.onload=()=>{
    try{const o=JSON.parse(r.result);if(!o||!o.v||!Array.isArray(o.tx)||!Array.isArray(o.wallets)||!Array.isArray(o.cats))throw 0;
      for(const x of o.tx)if(!x||typeof x.amt!=='number'||!validDate(x.d)||!['i','e','t'].includes(x.t))throw 0;
      if(!confirm(t('restoreAsk')))return;
      localStorage.setItem(KEY,JSON.stringify(o));S=load();render();toast(t('restoreOk'));if(S.settings.pin)showLock()}
    catch(e){toast(t('restoreBad'))}};
  r.readAsText(file);
}

function txType(x){return x.t==='i'?t('income'):x.t==='e'?t('expense'):t('transfer')}
function allTxSorted(){return[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)||a.id.localeCompare(b.id))}
function exportCsv(){
  const rows=[[t('date'),t('type'),t('category'),t('wallet'),t('to'),t('amount'),t('noteL')]].concat(allTxSorted().map(x=>[x.d,txType(x),x.t==='t'?'':catName(catById(x.c)),walName(x.w),x.t==='t'?walName(x.w2):'',x.amt,x.note||'']));
  saveBlob(new Blob(['﻿'+rows.map(r=>r.map(csvQ).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Income_Expense_'+stamp()+'.csv');
}
